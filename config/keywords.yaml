  search_queries:
    # 第一组：核心短剧类（竖屏、连续剧、微型）
    - "AI Video Series"
    - "AI Episodic Content"
    - "AI Mini-series"
    - "AI Storytelling"
    - "AI Filmmaking"
    - "Vertical AI Video / TikTok AI Series"
    - "AI Script-to-Video"
    # 第二组：漫画/二次元类
    - "AI Motion Comic"
    - "AI Animate Webtoon"
    - "AI Animate Manga"
    - "AI Anime Series"

